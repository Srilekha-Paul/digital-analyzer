<p>Monitor your daily screen usage and improve productivity</p>

<div class="dashboard-grid">

    <!-- Card 1 -->
    <div class="card">
        <h3>Productivity Score</h3>
        <p class="big-text">{{ score }}%</p>
    </div>

    <!-- Card 2 -->
    <div class="card">
        <h3>AI Suggestion</h3>
        <p>{{ advice }}</p>
    </div>

    <!-- Card 3 -->
    <div class="card">
        <h3>App Usage</h3>
        <canvas id="usageChart"></canvas>
    </div>

    <!-- Card 4 -->
    <div class="card">
        <h3>Report</h3>
        <p>Download your screen time report.</p>
        <a href="/download" class="download-btn">Download Report</a>
    </div>

</div>

</div>

<script>

const apps = {{ apps | tojson }};
const times = {{ times | tojson }};

</script>

<script src="/static/script.js"></script>

</body>
</html>
