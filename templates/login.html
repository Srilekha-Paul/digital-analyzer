<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Digital Detox Tracker</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>

  <!-- Flash Messages -->
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <div class="flash-messages">
        {% for category, message in messages %}
          <div class="flash flash-{{ category }}">
            <i class="fa-solid
              {% if category == 'success' %} fa-circle-check
              {% elif category == 'error'  %} fa-circle-xmark
              {% else %}                      fa-circle-info {% endif %}">
            </i>
            {{ message }}
          </div>
        {% endfor %}
      </div>
    {% endif %}
  {% endwith %}

  <div class="auth-page">
    <div class="auth-card">

      <!-- Logo -->
      <div class="auth-logo">
        <div class="auth-logo-icon">📊</div>
        <h1>Digital Detox Tracker</h1>
        <p>Monitor your screen time. Reclaim your focus.</p>
      </div>

      <!-- Form -->
      <form action="{{ url_for('login') }}" method="POST" novalidate>

        <div class="form-group">
          <label for="username">Username</label>
          <div class="form-input-wrapper">
            <i class="fa-regular fa-user input-icon"></i>
            <input
              type="text"
              id="username"
              name="username"
              class="form-control has-icon"
              placeholder="Enter your username"
              autocomplete="username"
              required
            />
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="form-input-wrapper">
            <i class="fa-solid fa-lock input-icon"></i>
            <input
              type="password"
              id="password"
              name="password"
              class="form-control has-icon"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            />
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-full" style="margin-top:0.5rem">
          <i class="fa-solid fa-right-to-bracket"></i>
          Sign In
        </button>

      </form>

      <div class="auth-divider">
        <hr /><span>or</span><hr />
      </div>

      <div class="auth-footer">
        Don't have an account?
        <a href="{{ url_for('register') }}">Create one &rarr;</a>
      </div>

    </div>
  </div>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
